    in: body
    required: true
    schema:
      type: object
      required:
        - "name"
        - "description"
      properties:
        name:
          type: "name"
          example: 'xxxxxx'
        description:
          type: "description"
          example: 'xxxxxx'
responses:
  201:
    description: When a data insert success

  400:
    description: Fails to insert due to bad request data