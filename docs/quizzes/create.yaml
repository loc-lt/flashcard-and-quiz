create
---
tags:
  - quizzes
parameters:
  - name: body
    description: The body should contain the insert data
    in: body
    required: true
    schema:
      type: object
      required:
        - "set_id"
        - "quantities"
        - "types"
      properties:
        set_id:
          type: "set_id"
          example: "xxxxxx"
        quantities:
          type: "quantities"
          example: ["x", "y", "z", "t"]
        types:
          type: "types"
          example: ["xxxxxx", "yyyyyy", "zzzzzz", "tttttt"]
responses:
  201:
    description: When a data insert success

  400:
    description: Fails to insert due to bad request data